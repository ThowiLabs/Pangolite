name: Calidad continua

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tests, analisis y builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Resolver modulos
        run: go mod download

      - name: Gate de calidad
        run: ./scripts/verify.sh

      - name: Build completo de todas las plataformas
        run: make release-build
