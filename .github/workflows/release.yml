name: Release manual

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version a publicar. Debe coincidir con VERSION del codigo; vacio usa la version declarada."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Crear release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Resolver modulos
        run: go mod download

      - name: Resolver version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          source_version="$(awk '/^VERSION[[:space:]]*\?=/{print $3; exit}' Makefile)"
          source_code="$(awk '/^VERSION_CODE[[:space:]]*\?=/{print $3; exit}' Makefile)"
          input="${{ github.event.inputs.version }}"
          input="${input#v}"

          if [[ ! "$source_version" =~ ^[0-9]+\.[0-9]+$ || ! "$source_code" =~ ^[0-9]+$ ]]; then
            echo "Version de desarrollo invalida en Makefile: $source_version (code $source_code)" >&2
            exit 1
          fi
          if [[ -n "$input" && "$input" != "$source_version" ]]; then
            echo "El release solicitado v${input} no coincide con la version del codigo v${source_version}. Actualiza VERSION/VERSION_CODE antes de publicar." >&2
            exit 1
          fi

          major="${source_version%%.*}"
          minor="${source_version#*.}"
          expected_code=$((10#$major * 100000 + 10#$minor))
          if [[ "$source_code" != "$expected_code" ]]; then
            echo "VERSION_CODE invalido: $source_code; para $source_version debe ser $expected_code" >&2
            exit 1
          fi

          tag="v${source_version}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "El tag $tag ya existe. Incrementa VERSION/VERSION_CODE en el codigo antes de publicar otro release." >&2
            exit 1
          fi
          echo "version=$source_version" >> "$GITHUB_OUTPUT"
          echo "version_code=$source_code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publicando $tag (code $source_code)"

      - name: Gate de calidad
        shell: bash
        run: ./scripts/verify.sh

      - name: Compilar y validar todos los artefactos
        shell: bash
        run: ./scripts/build-release.sh "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.version_code }}"

      - name: Notas del release
        shell: bash
        run: |
          set -euo pipefail
          subject="$(git log -1 --pretty=%s)"
          sha="$(git rev-parse --short HEAD)"
          {
            echo "Release ${{ steps.version.outputs.tag }}"
            echo "Código de versión: ${{ steps.version.outputs.version_code }}"
            echo
            echo "Ultimo commit incluido:"
            echo "- ${sha} ${subject}"
            echo
            echo "Binarios incluidos:"
            echo "- Linux amd64"
            echo "- Linux arm64"
            echo "- Linux 386"
            echo "- Linux armv7"
            echo "- Cliente Linux amd64"
            echo "- Cliente Linux arm64"
            echo "- Cliente Linux 386"
            echo "- Cliente Linux armv7"
            echo "- Cliente Windows amd64"
          } > release-notes.md

      - name: Crear release en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/* \
            --title "Pangolite ${{ steps.version.outputs.tag }}" \
            --notes-file release-notes.md
